# Membangun dan menerbitkan rilis jenderalcode setiap ada tag v*.
# Hasil: tar.gz untuk darwin/linux (arm64 & amd64) + SHA256SUMS, dipakai
# oleh install.sh.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Bangun binary semua target
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DATE="$(date -u +%Y-%m-%d)"
          COMMIT="${GITHUB_SHA}"
          LDFLAGS="-s -w -X github.com/mohammadirham37/jenderal_code/internal/cli.Version=${VERSION} -X github.com/mohammadirham37/jenderal_code/internal/cli.Commit=${COMMIT} -X github.com/mohammadirham37/jenderal_code/internal/cli.Date=${DATE}"
          mkdir -p dist
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64; do
            os="${target%%-*}"
            arch="${target##*-}"
            stage="dist/jenderalcode_${VERSION}_${os}_${arch}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "$stage/jenderalcode" ./cmd/jenderalcode
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "$LDFLAGS" -o "$stage/jc" ./cmd/jc
            tar -czf "dist/jenderalcode_${VERSION}_${os}_${arch}.tar.gz" -C "$stage" jenderalcode jc
            rm -rf "$stage"
          done
          (cd dist && sha256sum jenderalcode_*.tar.gz > SHA256SUMS)

      - name: Terbitkan rilis GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
